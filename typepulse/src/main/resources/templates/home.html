<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>TypePulse</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments :: top}"></div>
<main class="container">
    <section class="panel hero">
        <h1>TypePulse</h1>
        <p class="muted">Интерактивный тренажёр скорости печати: WPM, точность, история прогресса.</p>
        <div class="actions">
            <a class="btn" sec:authorize="isAuthenticated()" th:href="@{/training/setup}">Начать тренировку</a>
            <a class="btn" sec:authorize="!isAuthenticated()" th:href="@{/register}">Создать аккаунт</a>
            <a class="btn" sec:authorize="!isAuthenticated()" th:href="@{/login}" style="background:#31465c;color:#fff">Войти</a>
        </div>
    </section>
</main>
</body>
</html>
