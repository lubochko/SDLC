<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Настройка — TypePulse</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments :: top}"></div>
<main class="container">
    <section class="panel">
        <h1>Настройка тренировки</h1>
        <p class="flash err" th:if="${error}" th:text="${error}"></p>
        <form th:action="@{/training/start}" method="post">
            <div class="grid">
                <div>
                    <label>Язык</label>
                    <select name="language">
                        <option th:each="lang : ${languages}" th:value="${lang}" th:text="${lang}"></option>
                    </select>
                </div>
                <div>
                    <label>Сложность</label>
                    <select name="difficulty">
                        <option th:each="d : ${difficulties}" th:value="${d}" th:text="${d}"></option>
                    </select>
                </div>
                <div>
                    <label>Длительность (сек)</label>
                    <select name="durationSec">
                        <option th:each="dur : ${durations}" th:value="${dur}" th:text="${dur}"></option>
                    </select>
                </div>
            </div>
            <div class="actions">
                <button type="submit">Старт</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
