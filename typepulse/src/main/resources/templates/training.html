<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Тренировка — TypePulse</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments :: top}"></div>
<main class="container">
    <section class="panel">
        <div class="stats">
            <div class="stat"><span class="muted">Таймер</span><strong id="timer">--</strong></div>
            <div class="stat"><span class="muted">Live WPM</span><strong id="liveWpm">0</strong></div>
            <div class="stat"><span class="muted">Ошибки</span><strong id="liveErrors">0</strong></div>
        </div>
        <div id="prompt" class="prompt" aria-live="polite"></div>
        <input id="hiddenInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"/>
        <form id="finishForm" th:action="@{|/training/${session.id}/finish|}" method="post">
            <input type="hidden" name="typedText" id="typedText"/>
            <input type="hidden" name="elapsedMs" id="elapsedMs"/>
        </form>
        <form th:action="@{|/training/${session.id}/cancel|}" method="post" class="actions">
            <button type="submit" style="background:#31465c;color:#fff">Отменить</button>
        </form>
    </section>
</main>
<script th:inline="javascript">
    const reference = /*[[${text}]]*/ '';
    const durationSec = /*[[${session.durationSec}]]*/ 60;
    const promptEl = document.getElementById('prompt');
    const input = document.getElementById('hiddenInput');
    const timerEl = document.getElementById('timer');
    const wpmEl = document.getElementById('liveWpm');
    const errorsEl = document.getElementById('liveErrors');
    let typed = '';
    let startedAt = Date.now();
    let finished = false;

    function render() {
        let html = '';
        for (let i = 0; i < reference.length; i++) {
            const ch = reference[i] === ' ' ? '&nbsp;' : reference[i];
            if (i < typed.length) {
                const cls = typed[i] === reference[i] ? 'ok' : 'bad';
                html += '<span class="' + cls + '">' + ch + '</span>';
            } else if (i === typed.length) {
                html += '<span class="curr">' + ch + '</span>';
            } else {
                html += '<span>' + ch + '</span>';
            }
        }
        promptEl.innerHTML = html;
    }

    function liveMetrics() {
        const elapsedMs = Math.max(Date.now() - startedAt, 1);
        let correct = 0, errors = 0;
        const limit = Math.min(reference.length, typed.length);
        for (let i = 0; i < limit; i++) {
            if (typed[i] === reference[i]) correct++; else errors++;
        }
        if (typed.length > reference.length) errors += typed.length - reference.length;
        const wpm = (correct / 5) / (elapsedMs / 60000);
        wpmEl.textContent = wpm.toFixed(1);
        errorsEl.textContent = String(errors);
    }

    function tick() {
        if (finished) return;
        const left = durationSec - Math.floor((Date.now() - startedAt) / 1000);
        timerEl.textContent = String(Math.max(left, 0));
        liveMetrics();
        if (left <= 0 || typed.length >= reference.length) {
            finish();
        }
    }

    function finish() {
        if (finished) return;
        finished = true;
        document.getElementById('typedText').value = typed;
        document.getElementById('elapsedMs').value = String(Date.now() - startedAt);
        document.getElementById('finishForm').submit();
    }

    input.addEventListener('keydown', (e) => {
        if (finished) return;
        if (e.key === 'Backspace') {
            typed = typed.slice(0, -1);
            render();
            liveMetrics();
            e.preventDefault();
            return;
        }
        if (e.key.length === 1) {
            typed += e.key;
            render();
            liveMetrics();
            e.preventDefault();
        }
    });

    window.addEventListener('load', () => {
        input.focus();
        render();
        startedAt = Date.now();
        setInterval(tick, 200);
    });
    document.addEventListener('click', () => input.focus());
</script>
</body>
</html>
