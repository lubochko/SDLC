<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Регистрация — TypePulse</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments :: top}"></div>
<main class="container">
    <section class="panel">
        <h1>Регистрация</h1>
        <p class="flash err" th:if="${error}" th:text="${error}"></p>
        <form th:action="@{/register}" method="post" th:object="${form}">
            <label>Логин</label>
            <input type="text" name="login" th:value="*{login}" minlength="3" required/>
            <label>Email</label>
            <input type="email" name="email" th:value="*{email}" required/>
            <label>Пароль</label>
            <input type="password" name="password" minlength="6" required/>
            <div class="actions">
                <button type="submit">Создать аккаунт</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
