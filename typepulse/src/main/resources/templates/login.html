<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Вход — TypePulse</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments :: top}"></div>
<main class="container">
    <section class="panel">
        <h1>Вход</h1>
        <p class="flash err" th:if="${param.error}">Неверный логин или пароль</p>
        <p class="flash ok" th:if="${message}" th:text="${message}"></p>
        <form th:action="@{/login}" method="post">
            <label>Логин или email</label>
            <input type="text" name="username" required autofocus/>
            <label>Пароль</label>
            <input type="password" name="password" required/>
            <div class="actions">
                <button type="submit">Войти</button>
                <a th:href="@{/register}">Регистрация</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
