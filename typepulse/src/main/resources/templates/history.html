<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>История — TypePulse</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments :: top}"></div>
<main class="container">
    <section class="panel">
        <h1>История</h1>
        <p class="muted" th:if="${#lists.isEmpty(results)}">Пока нет результатов. Пройдите тренировку.</p>
        <table th:if="${!#lists.isEmpty(results)}">
            <thead>
            <tr>
                <th>Дата</th>
                <th>WPM</th>
                <th>Точность</th>
                <th>Ошибки</th>
                <th>Время</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${results}">
                <td th:text="${#temporals.format(r.finishedAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${r.wpm}"></td>
                <td th:text="${r.accuracy}"></td>
                <td th:text="${r.errors}"></td>
                <td th:text="${r.elapsedMs}"></td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
